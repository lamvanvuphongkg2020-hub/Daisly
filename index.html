<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffe5ef" />
  <title>Daily Wishes ♡</title>
  
  <!-- Google Fonts Tiếng Việt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #f7a9c4;
      --deep: #c95f8a;
      --ink: #74465a;
      --cream: #fff9fb;
      --font-heading: "Playfair Display", Georgia, serif;
      --font-body: "Be Vietnam Pro", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      font-family: var(--font-body);
      background:
        radial-gradient(circle at 15% 18%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 82% 26%, #fff 0 2px, transparent 3px),
        linear-gradient(135deg, #fff1f6 0%, #ffe0ec 48%, #fceafa 100%);
      background-size: 90px 90px, 120px 120px, auto;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .glow {
      position: fixed; width: 420px; height: 420px; border-radius: 50%;
      background: #fff; filter: blur(90px); opacity: .55; z-index: -1;
      top: 15%; left: 50%; transform: translateX(-50%);
    }
    .page {
      position: relative;
      width: min(100%, 720px);
      min-height: 520px;
      display: grid;
      place-items: center;
      isolation: isolate;
    }
    .wish-card {
      position: relative;
      width: min(100%, 480px);
      padding: 62px 34px 42px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 34px;
      background: rgba(255,255,255,.68);
      box-shadow: 0 24px 70px rgba(190, 100, 140, .18), inset 0 0 30px rgba(255,255,255,.7);
      backdrop-filter: blur(14px);
      animation: appear .9s ease both, float 5s ease-in-out 1s infinite;
    }
    @keyframes appear { from { opacity: 0; transform: translateY(22px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes float { 0%,100% { translate: 0 0; } 50% { translate: 0 -8px; } }
    .eyebrow { color: #c77b9b; letter-spacing: .22em; font-size: 11px; font-weight: 700; }
    h1 { margin: 14px 0 8px; color: #c45f89; font-family: var(--font-heading); font-size: clamp(34px, 7vw, 48px); font-weight: 600; }
    .date { color: #b68a9d; font-size: 13px; margin-bottom: 28px; }
    .divider { display: flex; align-items: center; justify-content: center; gap: 10px; color: #e99ab8; margin: 0 auto 22px; }
    .divider::before, .divider::after { content: ""; width: 48px; height: 1px; background: #f2bfd1; }
    #wish { 
      min-height: 92px; 
      display: grid; 
      place-items: center; 
      font-family: var(--font-heading); 
      font-size: clamp(20px, 4vw, 25px); 
      line-height: 1.6; 
      color: #795166; 
      transition: opacity .25s, transform .25s; 
    }
    #wish.changing { opacity: 0; transform: translateY(8px); }
    .from { margin-top: 22px; color: #c1849e; font-size: 13px; font-style: italic; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
    button {
      border: 0; border-radius: 999px; padding: 12px 22px; cursor: pointer;
      font-family: var(--font-body); font-size: 13px; font-weight: 600; letter-spacing: .02em; transition: transform .2s, box-shadow .2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(201,95,138,.18); }
    .primary { background: linear-gradient(135deg, #f3a8c2, #df80a5); color: white; }
    .secondary { background: #fff; color: #c16b91; border: 1px solid #f5d2df; }
    .music-note { margin-top: 17px; color: #bd91a4; font-size: 11px; }
    
    .orbit {
      position: absolute; width: 590px; height: 590px; max-width: 90vw; max-height: 90vw;
      pointer-events: none; z-index: -1; animation: spin 34s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .orbit span {
      position: absolute; left: 50%; top: 50%; transform-origin: 0 0;
      color: #d77e9f; font-size: 11px; font-weight: 700; letter-spacing: .13em;
      text-shadow: 0 1px 0 #fff; white-space: pre;
      font-family: var(--font-body);
    }
    .heart {
      position: fixed; bottom: -30px; color: #ec91b2; opacity: .7;
      animation: rise linear forwards; pointer-events: none; z-index: 2;
    }
    @keyframes rise { to { transform: translateY(-115vh) rotate(35deg); opacity: 0; } }
    .sparkle { position: absolute; color: #e99ab8; animation: twinkle 2.5s ease-in-out infinite; }
    .s1 { top: 8%; left: 12%; font-size: 25px; } .s2 { right: 9%; top: 17%; font-size: 19px; animation-delay: .8s; }
    .s3 { left: 13%; bottom: 10%; font-size: 18px; animation-delay: 1.2s; } .s4 { right: 12%; bottom: 8%; font-size: 27px; animation-delay: .4s; }
    @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.8) rotate(0); } 50% { opacity: 1; transform: scale(1.2) rotate(18deg); } }
    @media (max-width: 600px) {
      body { padding: 16px; }
      .page { min-height: 470px; }
      .wish-card { padding: 52px 22px 34px; }
      .orbit { width: 112vw; height: 112vw; }
      .orbit span { font-size: 8px; }
      .sparkle.s1 { left: 2%; } .sparkle.s2 { right: 2%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <main class="page">
    <div class="orbit" id="orbit" aria-hidden="true"></div>
    <span class="sparkle s1">✧</span><span class="sparkle s2">♡</span>
    <span class="sparkle s3">✦</span><span class="sparkle s4">♡</span>
    <section class="wish-card" aria-live="polite">
      <div class="eyebrow">A LITTLE NOTE FOR YOU</div>
      <h1>Daily Wishes</h1>
      <div class="date" id="today"></div>
      <div class="divider">♡ ✧ ♡</div>
      <div id="wish"></div>
      <div class="from" id="fromText">Gửi bạn một ngày thật dịu dàng ♡</div>
      <div class="actions">
        <button class="primary" id="todayWishBtn">Thông điệp hôm nay ✨</button>
        <button class="secondary" id="musicToggle" aria-pressed="false">♫ Bật nhạc</button>
      </div>
      <div class="music-note" id="musicStatus">Nhấn “Bật nhạc” để nghe giai điệu dịu dàng riêng của ngày hôm nay</div>
    </section>
  </main>

  <script>
    const recipientName = "Bé Yêu";
    
    const wishesList = [
      "Chúc bạn hôm nay luôn mỉm cười, gặp thật nhiều điều may mắn và bình yên. ♡",
      "Mong mọi điều tốt đẹp sẽ nhẹ nhàng tìm đến bạn, như nắng ghé qua ô cửa. 🌷",
      "Chúc bạn đủ mạnh mẽ để theo đuổi ước mơ và đủ dịu dàng để yêu thương chính mình.",
      "Hy vọng hôm nay có thật nhiều lý do khiến trái tim bạn vui vẻ. 💗",
      "Chúc bạn ăn ngon, ngủ ngoan, làm gì cũng thuận lợi và luôn được yêu thương.",
      "Dù hôm nay thế nào, hãy nhớ rằng bạn luôn xứng đáng với những điều tuyệt vời nhất. ✨",
      "Gửi bạn một chiếc ôm thật ấm và lời chúc cho một ngày an yên. 🧸",
      "Chúc những dự định của bạn đều nở hoa đúng lúc, rực rỡ theo cách riêng. 🌸",
      "Mong nụ cười sẽ ở lại thật lâu trên môi bạn, còn muộn phiền thì đi thật xa.",
      "Hãy cứ tỏa sáng theo cách của bạn nhé. Thế giới đẹp hơn khi có bạn! 💕",
      "Chúc bạn có một ngày ngập tràn năng lượng tích cực và những bất ngờ dễ thương.",
      "Mỗi ngày là một khởi đầu mới. Chúc bạn luôn tin vào những điều tốt đẹp phía trước."
    ];

    const wishEl = document.getElementById("wish");
    const fromEl = document.getElementById("fromText");

    function getDayOfYear() {
      const now = new Date();
      const start = new Date(now.getFullYear(), 0, 0);
      const diff = now - start;
      const oneDay = 1000 * 60 * 60 * 24;
      return Math.floor(diff / oneDay);
    }

    function getDailyWishIndex() {
      const dayNum = getDayOfYear();
      return dayNum % wishesList.length;
    }

    function personalized(text) {
      const name = recipientName.trim();
      return name ? `${name} ơi, ${text.charAt(0).toLocaleLowerCase("vi-VN")}${text.slice(1)}` : text;
    }

    function showDailyWish() {
      if (!wishesList.length) return;
      const idx = getDailyWishIndex();
      wishEl.classList.add("changing");
      setTimeout(() => {
        wishEl.textContent = personalized(wishesList[idx]);
        wishEl.classList.remove("changing");
      }, 220);
    }

    function updateGreeting() {
      fromEl.textContent = recipientName.trim()
        ? `Một điều dễ thương dành riêng cho ${recipientName.trim()} ♡`
        : "Gửi bạn một ngày thật dịu dàng ♡";
      showDailyWish();
    }

    updateGreeting();
    document.getElementById("todayWishBtn").addEventListener("click", showDailyWish);

    const dateStr = new Intl.DateTimeFormat("vi-VN", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(new Date());
    document.getElementById("today").textContent = dateStr.charAt(0).toLocaleUpperCase("vi-VN") + dateStr.slice(1);

    const orbit = document.getElementById("orbit");
    const ringText = "HAPPY DAY  ♡  LOVE YOU  ♡  HAVE A NICE DAY  ♡  ";
    const radius = 285;
    [...ringText].forEach((char, i) => {
      const span = document.createElement("span");
      const angle = (i / ringText.length) * Math.PI * 2 - Math.PI / 2;
      span.textContent = char;
      span.style.transform = `rotate(${angle}rad) translate(${radius}px) rotate(${Math.PI / 2}rad)`;
      orbit.appendChild(span);
    });

    function makeHeart() {
      const heart = document.createElement("span");
      heart.className = "heart";
      heart.textContent = Math.random() > .5 ? "♡" : "♥";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (12 + Math.random() * 20) + "px";
      heart.style.animationDuration = (7 + Math.random() * 6) + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 13500);
    }
    setInterval(makeHeart, 850);

    let audioContext = null, masterGain = null, musicTimer = null, noteIndex = 0;
    let musicOn = false;

    function getDailyMelody() {
      const dayNum = getDayOfYear();
      const baseFreqs = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25];
      let melody = [];
      for (let i = 0; i < 8; i++) {
        let notePos = (dayNum * (i + 3) + i * 7) % baseFreqs.length;
        melody.push(baseFreqs[notePos]);
      }
      return melody;
    }

    function playNote(freq, start, duration) {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.045, start + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      osc.connect(gain); gain.connect(masterGain);
      osc.start(start); osc.stop(start + duration + 0.03);
    }

    function startMusic() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      audioContext = audioContext || new AudioCtx();
      audioContext.resume();
      masterGain = audioContext.createGain();
      masterGain.gain.value = 0.55;
      masterGain.connect(audioContext.destination);
      musicOn = true;
      const melody = getDailyMelody();
      
      function tick() {
        if (!musicOn) return;
        const now = audioContext.currentTime;
        playNote(melody[noteIndex % melody.length], now, .62);
        if (noteIndex % 4 === 0) playNote(melody[(noteIndex + 2) % melody.length] / 2, now, .9);
        noteIndex++;
      }
      tick();
      musicTimer = setInterval(tick, 650);
      document.getElementById("musicToggle").textContent = "♫ Tắt nhạc";
      document.getElementById("musicToggle").setAttribute("aria-pressed", "true");
      document.getElementById("musicStatus").textContent = "Đang phát giai điệu dịu dàng của ngày hôm nay ♡";
    }

    function stopMusic() {
      musicOn = false;
      clearInterval(musicTimer);
      if (masterGain && audioContext) {
        masterGain.gain.setTargetAtTime(0, audioContext.currentTime, .08);
      }
      document.getElementById("musicToggle").textContent = "♫ Bật nhạc";
      document.getElementById("musicToggle").setAttribute("aria-pressed", "false");
      document.getElementById("musicStatus").textContent = "Nhạc đã tạm dừng";
    }

    document.getElementById("musicToggle").addEventListener("click", () => {
      if (musicOn) stopMusic(); else startMusic();
    });
  </script>
</body>
</html>
